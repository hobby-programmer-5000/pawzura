[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pawzura"
version = "0.2.2"
description = "An original SD desktop companion with an opt-in focus guardian for Windows"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "hobby-programmer-5000"}]
dependencies = ["PySide6-Essentials==6.12.0"]

[project.optional-dependencies]
build = ["PyInstaller==6.22.3"]
test-browser = ["playwright>=1.64,<2"]

[project.gui-scripts]
pawzura = "pawzura.app:main"

[tool.setuptools.packages.find]
include = ["pawzura*", "art_runtime"]

[tool.setuptools.package-data]
art_runtime = ["*.json", "*.txt", "*.ps1"]
