<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pawzura · Browser connection</title><link rel="stylesheet" href="options.css"></head>
<body><main><header><a class="brand" href="#">Pawzura</a><label class="language"><span data-i18n="language">Language</span><select id="language"><option value="en">English</option><option value="ko">한국어</option></select></label></header>
<p class="eyebrow" data-i18n="eyebrow">BROWSER CONNECTION</p><h1 data-i18n="title">Connect your companion.</h1><p class="lede" data-i18n="intro">Keep the desktop app open and follow these steps. No JSON editing is needed.</p>
<aside id="preview-warning" hidden data-i18n="file_preview"></aside>
<ol class="steps"><li><strong data-i18n="step1_title"></strong><p data-i18n="step1"></p></li><li><strong data-i18n="step2_title"></strong><p data-i18n="step2"></p></li><li><strong data-i18n="step3_title"></strong><p data-i18n="step3"></p></li></ol>
<form id="connection-form"><div class="fields"><label><span data-i18n="browser">Browser</span><select id="browser"><option value="chrome">Chrome</option><option value="edge">Edge</option><option value="firefox">Firefox</option><option value="brave">Brave</option><option value="opera">Opera</option><option value="vivaldi">Vivaldi</option><option value="arc">Arc</option><option value="zen">Zen</option></select></label><label><span data-i18n="port">Port</span><input id="port" type="number" min="1024" max="65535" value="47831" required><small data-i18n="port_hint"></small></label></div>
<div class="actions"><button id="auto-connect" type="button" data-i18n="auto_connect">Connect automatically</button><button id="disconnect" type="button" class="secondary" data-i18n="disconnect">Disconnect</button></div><p id="status" role="status" aria-live="polite"></p><details><summary data-i18n="manual_connection">Manual connection — advanced</summary><label for="token" data-i18n="code">Connection code</label><input id="token" type="password" autocomplete="off" spellcheck="false" required data-i18n-placeholder="code_placeholder"><label class="show-code"><input id="show-code" type="checkbox"><span data-i18n="show_code">Show code</span></label>
<button id="save" type="submit" data-i18n="connect">Connect and test</button></details></form>
<details><summary data-i18n="example_title"></summary><p data-i18n="example_intro"></p><pre><code>{
  "browser": "chrome",
  "port": 47831,
  "token": "EXAMPLE_ONLY_REPLACE_WITH_YOUR_APP_CONNECTION_CODE"
}</code></pre><p data-i18n="example_explain"></p><button id="example" type="button" class="secondary" data-i18n="fill_example"></button><label for="pairing" data-i18n="import_label"></label><textarea id="pairing" rows="4" spellcheck="false" placeholder='{"browser":"chrome","port":47831,"token":"your-app-code"}'></textarea><button id="import" type="button" class="secondary" data-i18n="import_button"></button><p class="note" data-i18n="import_hint"></p></details>
<footer><p data-i18n="privacy"></p><p data-i18n="defaults"></p></footer></main><script src="options-i18n.js"></script><script src="options.js"></script></body></html>
