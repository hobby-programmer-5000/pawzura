name: Build portable Windows executable
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt PyInstaller==6.22.3
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - run: Start-Process -FilePath dist/Pawzura/Pawzura.exe -ArgumentList '--smoke-check' -Wait -NoNewWindow
      - uses: actions/upload-artifact@v4
        with:
          name: Pawzura-windows-x64
          path: dist/Pawzura-*-windows-x64.zip
